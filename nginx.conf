
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;
events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;
	server {
        listen       3080;  # 端口可自定义（如 80、3000 等）
        server_name  localhost;

         # 指向前端资源目录（相对于 Nginx 启动路径）
        root   ../multi_market;  # 因为 dist 与 nginx 目录同级，所以用 ../dist
        index  index.html;

        # 解决单页应用路由问题（如 Vue/React 的 history 模式）
        location / {
            try_files $uri $uri/ /index.html;
        }
		
		location /api/xueQiuServer/ {
			proxy_pass https://stock.xueqiu.com/; # 目标路径
			proxy_set_header Host stock.xueqiu.com;
			
			proxy_set_header Cookie $http_xueqiucookie;

			# 保留客户端信息
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# 跨域头（可选）
			add_header Access-Control-Allow-Origin *;
			add_header Access-Control-Allow-Credentials true;
		}
    }
    server {
        listen       8099;
        server_name  localhost;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        location / {
            root   html;
            index  index.html index.htm;
